<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Luxury Hostels India</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="auth-page">
    <div class="auth-container">
        <!-- Left Side - Image -->
        <div class="auth-left">
            <div class="auth-brand">
                <i class="fas fa-hotel"></i>
                <h1>Luxury Hostels India</h1>
                <p>5-Star stays across India's tourist destinations</p>
            </div>
        </div>

        <!-- Right Side - Login Form -->
        <div class="auth-right">
            <div class="auth-form">
                <h2>Welcome Back</h2>
                <p>Login to book your luxury hostel stay</p>

                <form id="login-form">
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="login-email" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="login-password" placeholder="Password" required>
                        <span class="eye-toggle" onclick="togglePassword('login-password')">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                    <button type="submit" class="auth-btn">
                        <span>Login</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <div class="divider">
                    <span>or continue with</span>
                </div>

                <div class="social-login">
                    <button class="social-btn google">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button class="social-btn phonepe">
                        <i class="fab fa-phone"></i> PhonePe
                    </button>
                </div>

                <p class="auth-link">
                    Don't have an account?
                    <a href="register.html">Register here</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
<footer class="auth-footer">
    <p>&copy; 2024 <strong>H&H Luxury Hostels</strong> |
        <a href="mailto:support@H&HLuxury.com">support@H&HLuxury.com</a> |
        <a href="privacy.html">Privacy</a> | <a href="terms.html">Terms</a>
    </p>
</footer>

</html>
