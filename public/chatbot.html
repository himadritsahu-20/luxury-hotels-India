<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot - Luxury Hostels India</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="chatbot-page">
    <!-- Header -->
    <header class="chat-header">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-hotel"></i> Luxury Hostels
            </a>
            <h1><i class="fas fa-comments"></i> Smart Assistant</h1>
        </div>
    </header>

    <!-- Chatbot Fullscreen -->
    <div class="chatbot-fullscreen">
        <div class="chatbot-header">
            <div class="bot-avatar">
                <i class="fas fa-robot"></i>
            </div>
            <div>
                <h3>Luxury Hostels Assistant</h3>
                <span>Online 24/7</span>
            </div>
            <button id="minimize-chat" class="minimize-btn">
                <i class="fas fa-minus"></i>
            </button>
        </div>

        <div class="chatbot-messages" id="chatbot-messages">
            <div class="message bot">
                <div class="bot-avatar-small">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="message-content">
                    <p>Hello! 👋 I'm here to help you find the perfect 5-star luxury hostel in India.</p>
                    <p>Ask me about:</p>
                    <ul>
                        <li>Best hostels in Goa/Manali/Rishikesh</li>
                        <li>Booking process & PhonePe payments</li>
                        <li>Prices & availability</li>
                        <li>Your travel plans</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="chatbot-input-container">
            <div class="quick-replies">
                <button onclick="sendQuickMessage('goa')">Goa hostels</button>
                <button onclick="sendQuickMessage('manali')">Manali hostels</button>
                <button onclick="sendQuickMessage('payment')">PhonePe payment</button>
                <button onclick="sendQuickMessage('book')">How to book</button>
            </div>
            <div class="chat-input-wrapper">
                <input type="text" id="chatbot-input" placeholder="Type your message...">
                <button id="chatbot-send">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="js/chatbot.js"></script>
</body>

</html>
